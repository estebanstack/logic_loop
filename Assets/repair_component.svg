<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Base hexagonal de acople en el suelo -->
  <polygon points="32,6 54,18 54,46 32,58 10,46 10,18" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  
  <!-- Anillo exterior de energía -->
  <circle cx="32" cy="32" r="18" fill="#0f172a" stroke="#f97316" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- Bobinas de inducción electromagnética -->
  <rect x="29" y="10" width="6" height="6" fill="#f59e0b" rx="1"/>
  <rect x="29" y="48" width="6" height="6" fill="#f59e0b" rx="1"/>
  <rect x="13" y="29" width="6" height="6" fill="#f59e0b" rx="1"/>
  <rect x="45" y="29" width="6" height="6" fill="#f59e0b" rx="1"/>

  <!-- Núcleo de plasma / Cristal cuántico de reparación -->
  <polygon points="32,18 44,32 32,46 20,32" fill="#06b6d4" stroke="#67e8f9" stroke-width="2"/>
  <polygon points="32,23 39,32 32,41 25,32" fill="#a5f3fc"/>
  <circle cx="32" cy="32" r="4" fill="#ffffff"/>

  <!-- Destellos y emisión de partículas de energía -->
  <circle cx="27" cy="25" r="1.5" fill="#f97316"/>
  <circle cx="37" cy="39" r="1.5" fill="#06b6d4"/>
</svg>
