<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Propulsores traseros (lado izquierdo ya que mira a la derecha) -->
  <rect x="8" y="16" width="10" height="8" rx="2" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
  <rect x="8" y="40" width="10" height="8" rx="2" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
  <path d="M4 20 L8 18 L8 22 Z" fill="#34d399"/>
  <path d="M4 44 L8 42 L8 46 Z" fill="#34d399"/>

  <!-- Chasis principal aerodinámico del dron -->
  <ellipse cx="32" cy="32" rx="22" ry="18" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
  
  <!-- Placas de blindaje superior e inferior -->
  <path d="M18 20 Q32 14 46 20" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <path d="M18 44 Q32 50 46 44" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>

  <!-- Núcleo central de energía -->
  <circle cx="32" cy="32" r="11" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <circle cx="32" cy="32" r="6" fill="#34d399"/>
  <circle cx="30" cy="30" r="2" fill="#ecfdf5"/>

  <!-- Sensor óptico / Lente frontal (apuntando a la derecha) -->
  <path d="M50 26 Q56 32 50 38" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>
  <circle cx="49" cy="32" r="3" fill="#10b981"/>
  <circle cx="50" cy="31" r="1" fill="#ffffff"/>

  <!-- Líneas de circuitos decorativas -->
  <line x1="20" y1="32" x2="14" y2="32" stroke="#10b981" stroke-width="2"/>
  <line x1="43" y1="32" x2="46" y2="32" stroke="#10b981" stroke-width="2"/>
</svg>
