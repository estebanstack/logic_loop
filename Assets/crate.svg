<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Contenedor industrial de herramientas -->
  <rect x="4" y="6" width="40" height="36" rx="4" fill="#334155" stroke="#64748b" stroke-width="2"/>
  
  <!-- Refuerzo frontal metálico -->
  <rect x="8" y="10" width="32" height="28" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

  <!-- Franjas de advertencia industrial en la caja -->
  <rect x="12" y="20" width="24" height="8" fill="#f59e0b"/>
  <line x1="16" y1="20" x2="13" y2="28" stroke="#1e293b" stroke-width="2"/>
  <line x1="22" y1="20" x2="19" y2="28" stroke="#1e293b" stroke-width="2"/>
  <line x1="28" y1="20" x2="25" y2="28" stroke="#1e293b" stroke-width="2"/>
  <line x1="34" y1="20" x2="31" y2="28" stroke="#1e293b" stroke-width="2"/>

  <!-- Cerrojo de seguridad / Manija -->
  <rect x="20" y="12" width="8" height="4" rx="1" fill="#94a3b8"/>
  <circle cx="24" cy="14" r="1" fill="#0f172a"/>

  <!-- Indicador LED de estado de la pieza -->
  <circle cx="12" cy="14" r="2" fill="#10b981"/>
</svg>
